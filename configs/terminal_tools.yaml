tools:
  - class_name: rsched.tools.SchemaOnlyTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: bash
        description: >-
          Run a bash command in the task's working directory and return its
          combined stdout/stderr and exit code. State (files) persists between calls.
        parameters:
          type: object
          properties:
            command:
              type: string
              description: The bash command to run.
          required: [command]
